[pytest]
testpaths = python/tests
asyncio_mode = auto
# `python` for engine package; `.` (repo-root) for `tools.lint` (issue #42 Phase 6).
pythonpath = python .
markers =
    demo_tachibana: marks tests that require a real Tachibana demo account (deselect with -m "not demo_tachibana")
    tk_smoke: marks tkinter dialog smoke tests (run with xvfb-run on CI; require no display on --auto-cancel path)
    demo_kabu: marks tests that use HTTPXMock for kabustation API (no real kabustation required)
    smoke: 実プロセス起動を伴う結合テスト (CI default では --smoke 指定時のみ実行)
    live_demo: live demo CLI/GUI smoke (workflow_dispatch only, attach mode)
    live_demo_inprocess: live demo in-process smoke (ローカル限定、CI からは除外)
timeout = 60
filterwarnings =
    ignore:jsonschema.RefResolver is deprecated:DeprecationWarning
