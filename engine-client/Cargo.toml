[package]
name = "flowsurface-engine-client"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license = "MIT"
description = "IPC client connecting Flowsurface to the Python data engine"

[dependencies]
exchange.workspace = true
chrono.workspace = true
# HIGH-8 (ラウンド 6 強制修正 / Group F): wire DTOs for venue payloads
# (`TachibanaCredentialsWire` / `TachibanaSessionWire`) now live in
# `data::wire::tachibana`. `engine-client::dto` re-exports them so
# existing consumers see no API change.
data.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
uuid.workspace = true

tokio = { version = "1.43", default-features = false, features = ["full"] }
futures = "0.3.32"
rand = "0.9.2"
url = "2.5.8"
bytes = "1.8.0"
async-stream = "0.3"
# C3: pid liveness check for reap_stale (cross-platform)
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

# WebSocket transport to Python engine (plain ws://, no TLS required for loopback)
fastwebsockets = { version = "0.9.0", default-features = false, features = ["upgrade"] }
http-body-util = "0.1.2"
hyper = { version = "1", default-features = false, features = ["http1", "client"] }
hyper-util = { version = "0.1.10", default-features = false }

# gRPC transport (G0 — proto codegen via build.rs + tonic-build)
tonic = { version = "0.12", default-features = false, features = ["channel", "codegen", "prost"] }
prost = "0.13"

[build-dependencies]
tonic-build = { version = "0.12", default-features = false, features = ["prost"] }
# Vendor protoc binary so builds work without a system protoc (Windows / CI).
protoc-bin-vendored = "3"

[features]
# Phase 8 review-fix-loop R1 / Phase 4 H-Rust2:
# Gate test-only public seams (`apply_after_handshake_with_timeout` /
# `try_attach_or_spawn`) behind a non-default feature so release artefacts
# never expose them. Integration tests in `engine-client/tests/*` enable
# this via the self-dev-dependency below.
testing = []
# G1: WebSocket transport feature flag (kept for backward-compat / rollback).
ws-transport = []

[dev-dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
tempfile = "3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# H-Rust2: enable the `testing` feature for integration tests in `tests/`
# so the gated seams (`apply_after_handshake_with_timeout` /
# `try_attach_or_spawn`) are visible to them but stay hidden in release.
flowsurface-engine-client = { path = ".", features = ["testing"] }
