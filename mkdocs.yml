site_name: e-station dev
site_description: e-station エンジニア向けドキュメント
site_url: https://botteryosuke.github.io/e-station/
repo_url: https://github.com/botterYosuke/e-station
repo_name: botterYosuke/e-station
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# 公開対象から除外するファイル群。MkDocs 1.6+ の exclude_docs は gitignore 形式。
# wiki/** と plan/floating-windows / plan/distribution-formats は Wave 4 で物理削除済み。
# plan/❌archive/ のみ残置 (計画書方針)。
exclude_docs: |
  *.json
  */archive/**
  decisions/manifest.yaml
  plan/❌archive/**
  plan/doc-restructure/**

theme:
  name: material
  language: ja
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切替
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切替

nav:
  - ホーム: index.md
  - アーキテクチャ:
      - 概要: architecture/overview.md
      - 境界: architecture/boundaries.md
      - データフロー: architecture/data-flow.md
      - IPC スキーマ: architecture/ipc-schema.md
      - モジュール:
          - data engine: architecture/modules/data-engine.md
          - tachibana adapter: architecture/modules/tachibana-adapter.md
          - kabusapi adapter: architecture/modules/kabusapi-adapter.md
          - nautilus-trader: architecture/modules/nautilus-trader.md
          - UI シェル: architecture/modules/ui-shell.md
  - 仕様:
      - 注文: specs/order.md
      - replay: specs/replay.md
      - live strategy: specs/live-strategy.md
      - backtest: specs/backtest.md
      - data engine: specs/data-engine.md
      - venue:
          - tachibana: specs/venues/tachibana.md
          - kabusapi: specs/venues/kabusapi.md
  - リファレンス:
      - 外部 API:
          - tachibana: reference/external-apis/tachibana.md
          - kabusapi: reference/external-apis/kabusapi.md
          - nautilus-trader: reference/external-apis/nautilus-trader.md
      - IPC プロトコル: reference/ipc-protocol.md
  - 開発:
      - セットアップ: development/setup.md
      - ビルド & リリース: development/build-and-release.md
      - トラブルシューティング: development/troubleshooting.md
  - テスト:
      - 戦略: testing/strategy.md
      - ベンチマーク: testing/benchmarks.md
  - コントリビュート:
      - コーディング規約: contributing/coding-standards.md
  - ロードマップ:
      - 概要: roadmap/README.md
      - data engine:
          - 実装計画: roadmap/data-engine/implementation-plan.md
          - Open Questions: roadmap/data-engine/open-questions.md
      - tachibana:
          - 実装計画: roadmap/tachibana/implementation-plan.md
          - Open Questions: roadmap/tachibana/open-questions.md
      - kabusapi:
          - 実装計画: roadmap/kabusapi/implementation-plan.md
          - Open Questions: roadmap/kabusapi/open-questions.md
      - order:
          - 実装計画: roadmap/order/implementation-plan.md
          - Open Questions: roadmap/order/open-questions.md
      - nautilus-trader:
          - 実装計画: roadmap/nautilus-trader/implementation-plan.md
          - Open Questions: roadmap/nautilus-trader/open-questions.md
      - UI シェル:
          - 実装計画: roadmap/ui-shell/implementation-plan.md
          - 仕様: roadmap/ui-shell/spec.md
          - アーキテクチャ: roadmap/ui-shell/architecture.md
          - Open Questions: roadmap/ui-shell/open-questions.md
      - スキーマ変更年表: roadmap/changelog.md
  - 決定 (ADR):
      - 一覧: decisions/README.md
      - 0001 Rust↔Python 境界: decisions/0001-rust-python-boundary.md
      - 0002 IPC スキーマ版数: decisions/0002-ipc-schema-versioning.md
      - 0006 言語スタック: decisions/0006-language-stack-rust-plus-python.md
      - 0007 Rust 採用: decisions/0007-rust-adoption.md
      - 0008 Python 採用: decisions/0008-python-adoption.md
      - deferred (0009–0133):
          - 0009-0015 floating-windows: decisions/0009-readme.md
          - 0016-0021 kabusapi: decisions/0016-comparison.md
          - 0022-0044 menu-and-footer: decisions/0022-p5-scenario-in-strategy.md
          - 0045-0073 nautilus_trader: decisions/0045-fix-issue1-instrument-input-removal.md
          - 0074-0090 order: decisions/0074-add-positions-pane-plan.md
          - 0091-0110 python-data-engine: decisions/0091-implementationloop-plan.md
          - 0111-0133 tachibana: decisions/0111-fix-engine-pipe-non-utf8-2026-04-28.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - ja
        - en
  - redirects:
      redirect_maps:
        # 旧 ✅* パスを台帳に基づいて新パスに 301
        ✅python-data-engine/spec.md: specs/data-engine.md
        ✅python-data-engine/current-architecture.md: architecture/modules/data-engine.md
        ✅python-data-engine/implementation-plan.md: roadmap/data-engine/implementation-plan.md
        ✅python-data-engine/open-questions.md: roadmap/data-engine/open-questions.md
        ✅tachibana/spec.md: specs/venues/tachibana.md
        ✅tachibana/architecture.md: architecture/modules/tachibana-adapter.md
        ✅tachibana/data-mapping.md: reference/external-apis/tachibana.md
        ✅tachibana/implementation-plan.md: roadmap/tachibana/implementation-plan.md
        ✅tachibana/open-questions.md: roadmap/tachibana/open-questions.md
        ✅tachibana/invariant-tests.md: testing/strategy.md
        ✅kabusapi/spec.md: specs/venues/kabusapi.md
        ✅kabusapi/architecture.md: architecture/modules/kabusapi-adapter.md
        ✅kabusapi/data-mapping.md: reference/external-apis/kabusapi.md
        ✅kabusapi/implementation-plan.md: roadmap/kabusapi/implementation-plan.md
        ✅kabusapi/open-questions.md: roadmap/kabusapi/open-questions.md
        ✅kabusapi/invariant-tests.md: testing/strategy.md
        ✅order/spec.md: specs/order.md
        ✅order/architecture.md: specs/order.md
        ✅order/implementation-plan.md: roadmap/order/implementation-plan.md
        ✅order/open-questions.md: roadmap/order/open-questions.md
        ✅order/invariant-tests.md: testing/strategy.md
        ✅nautilus_trader/spec.md: specs/backtest.md
        ✅nautilus_trader/architecture.md: architecture/modules/nautilus-trader.md
        ✅nautilus_trader/data-mapping.md: reference/external-apis/nautilus-trader.md
        ✅nautilus_trader/implementation-plan.md: roadmap/nautilus-trader/implementation-plan.md
        ✅nautilus_trader/open-questions.md: roadmap/nautilus-trader/open-questions.md
        ✅menu-and-footer/menu-bar.md: architecture/modules/ui-shell.md
        ✅menu-and-footer/replay-control.md: architecture/modules/ui-shell.md
        ✅menu-and-footer/footer.md: architecture/modules/ui-shell.md
        ✅menu-and-footer/mode-switch.md: architecture/modules/ui-shell.md
        ✅menu-and-footer/file-menu.md: architecture/modules/ui-shell.md
        ✅menu-and-footer/venue-login-footer.md: architecture/modules/ui-shell.md
        ✅python-data-engine/benchmarks/baseline.md: testing/benchmarks/baseline.md
        ✅python-data-engine/benchmarks/phase-2.md: testing/benchmarks/phase-2.md
        ✅python-data-engine/benchmarks/phase-6.md: testing/benchmarks/phase-6.md
        ✅python-data-engine/schemas/CHANGELOG.md: roadmap/changelog.md
        plan/floating-windows/spec.md: roadmap/ui-shell/spec.md
        plan/floating-windows/architecture.md: roadmap/ui-shell/architecture.md
        plan/floating-windows/implementation-plan.md: roadmap/ui-shell/implementation-plan.md
        plan/floating-windows/open-questions.md: roadmap/ui-shell/open-questions.md
        plan/distribution-formats/linux-formats.md: development/build-and-release.md
        plan/distribution-formats/pip-install-estation.md: development/build-and-release.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/botterYosuke/e-station

copyright: Released under the GPL-3.0 License.
