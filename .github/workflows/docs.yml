name: Docs (verify + deploy)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'scripts/verify_*.py'
      - 'scripts/check_adr_status.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'scripts/verify_*.py'
      - 'scripts/check_adr_status.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (docs + dev)
        run: uv sync --group docs --group dev

      - name: verify_migration_manifest
        run: uv run python scripts/verify_migration_manifest.py
        continue-on-error: true

      - name: verify_migrated_from
        run: uv run python scripts/verify_migrated_from.py
        continue-on-error: true

      - name: verify_no_legacy_paths
        run: uv run python scripts/verify_no_legacy_paths.py
        continue-on-error: true

      - name: verify_nav_depth
        run: uv run python scripts/verify_nav_depth.py

      - name: check_adr_status
        run: uv run python scripts/check_adr_status.py

      - name: mkdocs build --strict
        run: uv run --group docs mkdocs build --strict
        continue-on-error: true

  build:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Build MkDocs site
        run: uv run --group docs mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
