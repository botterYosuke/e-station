name: proto-lint
on: [push, pull_request]
jobs:
  buf-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint proto/
      - run: |
          git show main:buf.yaml 2>/dev/null && buf breaking proto/ --against '.git#branch=main' || echo "buf.yaml not in main yet — skipping breaking check"
